name: Generate Cloud Sync Composer Lock

on:
  push:
    branches: [feature/cloud-sync-deployment]
    paths:
      - 'backend/composer.json'
      - '.github/workflows/cloud-sync-lock.yml'

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/cloud-sync-deployment
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Update S3 filesystem dependency lock
        working-directory: backend
        run: composer update league/flysystem-aws-s3-v3 --with-all-dependencies --no-interaction --prefer-dist
      - name: Validate Composer files
        working-directory: backend
        run: composer validate --no-check-publish
      - name: Commit updated lock file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/composer.lock
          if ! git diff --cached --quiet; then
            git commit -m "Lock S3 filesystem dependency"
            git push origin HEAD:feature/cloud-sync-deployment
          fi
