name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  laravel:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      ZAWSE_USER_ONE_NAME: You
      ZAWSE_USER_ONE_EMAIL: you@example.test
      ZAWSE_USER_ONE_PASSWORD: test-password-one
      ZAWSE_USER_TWO_NAME: Love
      ZAWSE_USER_TWO_EMAIL: love@example.test
      ZAWSE_USER_TWO_PASSWORD: test-password-two
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, sqlite, pdo_sqlite
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env
      - run: touch database/database.sqlite
      - run: php artisan key:generate
      - run: php artisan migrate --force
      - run: php artisan db:seed --force
      - run: php artisan route:list
